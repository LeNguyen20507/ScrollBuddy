<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScrollBuddy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🔍</span>
        <h1>ScrollBuddy</h1>
      </div>
      <button class="focus-btn" id="focus-btn" title="Focus on current page">
        <span class="focus-icon">👁️</span>
        <span class="focus-text">Focus</span>
      </button>
    </header>

    <!-- Focus Mode Banner -->
    <div class="focus-banner" id="focus-banner" style="display: none;">
      <div class="focus-info">
        <span class="focus-status">📖 Reading:</span>
        <span class="focus-title" id="focus-title">Page title</span>
      </div>
      <button class="focus-close" id="focus-close" title="Exit focus mode">&times;</button>
    </div>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="chat">Chat</button>
      <button class="tab" data-tab="history">History</button>
    </nav>

    <!-- Chat Tab -->
    <main class="tab-content active" id="chat-tab">
      <!-- Messages Container -->
      <div class="messages" id="messages">
        <div class="message assistant">
          <div class="message-content">
            <p>Hi! I'm ScrollBuddy 👋</p>
            <p>I can help you:</p>
            <ul>
              <li><strong>Fact-check</strong> - Select text and click 📋</li>
              <li><strong>Focus mode</strong> - Click 👁️ to read the full page</li>
              <li><strong>Add to calendar</strong> - Tell me about an event</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <button class="action-btn" id="get-selection" title="Fact-check selected text">
          <span>📋</span>
        </button>
        <button class="action-btn calendar-btn" id="add-event-btn" title="Add event to calendar">
          <span>📅</span>
        </button>
        <textarea 
          id="user-input" 
          placeholder="Ask me anything about this page..."
          rows="1"
        ></textarea>
        <button class="send-btn" id="send-btn" title="Send message">
          <span>➤</span>
        </button>
      </div>
    </main>

    <!-- History Tab -->
    <main class="tab-content" id="history-tab">
      <div class="history-header">
        <span class="history-title">Fact-check History</span>
        <button class="clear-history-btn" id="clear-history" title="Clear all history">
          🗑️ Clear
        </button>
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-state">
          <span class="empty-icon">📚</span>
          <p>No fact-checks yet</p>
          <p class="empty-hint">Your verified claims will appear here</p>
        </div>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
